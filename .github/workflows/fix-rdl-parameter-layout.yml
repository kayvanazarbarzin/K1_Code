name: Fix RDL parameter layout

on:
  pull_request:
    paths:
      - '.github/rdl-layout-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix-rdl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add parameter layout
        shell: python
        run: |
          from pathlib import Path

          source = Path('artifacts/production-order-material-planning-final-optimized.rdl')
          target = Path('artifacts/production-order-material-planning-final-optimized-parameter-layout-fixed.rdl')
          text = source.read_text(encoding='utf-8')

          layout = '''  <ReportParametersLayout>
    <GridLayoutDefinition>
      <NumberOfColumns>3</NumberOfColumns>
      <NumberOfRows>1</NumberOfRows>
      <CellDefinitions>
        <CellDefinition>
          <ColumnIndex>0</ColumnIndex>
          <RowIndex>0</RowIndex>
          <ParameterName>Pro</ParameterName>
        </CellDefinition>
        <CellDefinition>
          <ColumnIndex>1</ColumnIndex>
          <RowIndex>0</RowIndex>
          <ParameterName>StartDate</ParameterName>
        </CellDefinition>
        <CellDefinition>
          <ColumnIndex>2</ColumnIndex>
          <RowIndex>0</RowIndex>
          <ParameterName>EndDate</ParameterName>
        </CellDefinition>
      </CellDefinitions>
    </GridLayoutDefinition>
  </ReportParametersLayout>
'''

          if '<ReportParametersLayout>' in text:
              start = text.index('  <ReportParametersLayout>')
              end = text.index('  </ReportParametersLayout>', start) + len('  </ReportParametersLayout>\n')
              text = text[:start] + layout + text[end:]
          else:
              marker = '  </ReportParameters>\n'
              if marker not in text:
                  raise RuntimeError('ReportParameters closing element not found')
              text = text.replace(marker, marker + layout, 1)

          if text.count('<ReportParameter Name=') != 3:
              raise RuntimeError('Expected exactly three report parameters')
          if text.count('<CellDefinition>') != 3:
              raise RuntimeError('Expected exactly three parameter layout cells')

          target.write_text(text, encoding='utf-8', newline='\n')

      - name: Upload corrected RDL
        uses: actions/upload-artifact@v4
        with:
          name: production-order-material-planning-final-rdl
          path: artifacts/production-order-material-planning-final-optimized-parameter-layout-fixed.rdl
